# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Trigger Parent Deploy

"on":
  push:
    branches:
      - Nam

jobs:
  trigger-parent-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Dispatch parent deploy workflow
        shell: bash
        env:
          PARENT_REPO_TOKEN: ${{ secrets.PARENT_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PARENT_REPO_TOKEN}" ]; then
            echo "PARENT_REPO_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PARENT_REPO_TOKEN}" \
            https://api.github.com/repos/Miikey24s/gtas_vpp/actions/workflows/deploy.yml/dispatches \
            -d @- <<EOF
          {
            "ref": "Nam",
            "inputs": {
              "source_repo": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}"
            }
          }
          EOF
