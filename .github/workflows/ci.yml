name: Continuous Integration

on:
  pull_request:
  push:
    branches-ignore:
      - Nam

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore gtas_vpp.sln

      - name: Build solution
        run: dotnet build gtas_vpp.sln -c Release --no-restore

      - name: Run backend tests
        run: dotnet test gtas_vpp_be.Tests/gtas_vpp_be.Tests.csproj -c Release --no-build

      - name: Run frontend tests
        run: dotnet test gtas_vpp_fe.Tests/gtas_vpp_fe.Tests.csproj -c Release --no-build
