name: Continuous Integration

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (current tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Run pinned Gitleaks current-tree gate
        shell: pwsh
        run: ./scripts/security/Invoke-Gitleaks.ps1 -Mode Current

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore gtas_vpp.sln

      - name: Build solution
        run: dotnet build gtas_vpp.sln -c Release --no-restore

      - name: Run backend tests
        run: dotnet test gtas_vpp_be.Tests/gtas_vpp_be.Tests.csproj -c Release --no-build

      - name: Run frontend tests
        run: dotnet test gtas_vpp_fe.Tests/gtas_vpp_fe.Tests.csproj -c Release --no-build

      - name: Run QA fixture safety contracts
        run: dotnet test gtas_vpp_be.IntegrationTests/gtas_vpp_be.IntegrationTests.csproj -c Release --no-build
