name: Continuous Integration

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (current tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Run pinned Gitleaks current-tree gate
        shell: pwsh
        run: ./scripts/security/Invoke-Gitleaks.ps1 -Mode Current

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check committed whitespace
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if ($env:BASE_SHA -match '^0+$') {
            git show --check --oneline --no-renames $env:HEAD_SHA
          }
          else {
            git diff --check $env:BASE_SHA $env:HEAD_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore gtas_vpp.sln

      - name: Build solution
        run: dotnet build gtas_vpp.sln -c Release --no-restore

      - name: Run backend tests
        run: dotnet test gtas_vpp_be.Tests/gtas_vpp_be.Tests.csproj -c Release --no-build

      - name: Run frontend tests
        run: dotnet test gtas_vpp_fe.Tests/gtas_vpp_fe.Tests.csproj -c Release --no-build

      - name: Run QA fixture safety contracts
        run: dotnet test gtas_vpp_be.IntegrationTests/gtas_vpp_be.IntegrationTests.csproj -c Release --no-build

      - name: Run UI configuration syntax smoke
        run: dotnet test gtas_vpp_fe.UITests/gtas_vpp_fe.UITests.csproj -c Release --no-build --filter "FullyQualifiedName~ComposeConfigurationSyntaxTests"

      - name: Check EF migration model
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project gtas_vpp_be/gtas_vpp_be.Migrations/gtas_vpp_be.Migrations.csproj \
            --startup-project gtas_vpp_be/gtas_vpp_be/gtas_vpp_be.csproj \
            --context VPPMigrationDbContext \
            --configuration Release \
            --no-build

      - name: Check vulnerable NuGet packages
        shell: pwsh
        run: |
          $audit = dotnet list gtas_vpp.sln package --vulnerable --include-transitive --format json | ConvertFrom-Json
          $packages = @(
            $audit.projects |
              ForEach-Object { $_.frameworks } |
              ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
              Where-Object { $_ }
          )
          if ($packages.Count -gt 0) {
            $packages | ConvertTo-Json -Depth 8
            throw "Vulnerable NuGet packages were found."
          }

      - name: Verify final thesis DOCX structure
        run: python LVTN/tooling/check_99_final.py
