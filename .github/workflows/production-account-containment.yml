name: Production demo account containment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CONTAIN-EXACT-12-DEMO-ACCOUNTS
        required: true
        type: string

permissions:
  contents: read

jobs:
  contain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    concurrency:
      group: gtas-vpp-production
      cancel-in-progress: false

    steps:
      - name: Verify immutable target and explicit confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Miikey24s/gtas_vpp"
          test "$GITHUB_REF" = "refs/heads/Nam"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$CONFIRMATION" = "CONTAIN-EXACT-12-DEMO-ACCOUNTS"

      - name: Checkout exact containment source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Configure pinned SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/containment_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

      - name: Upload and run fail-closed containment
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: /tmp/gtas-vpp-account-containment-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"

          ssh_opts=(
            -i "$RUNNER_TEMP/containment_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts"
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o ConnectTimeout=10
          )
          target="$SSH_USER@$SSH_HOST"

          ssh "${ssh_opts[@]}" "$target" \
            "install -d -m 0700 '$REMOTE_DIR'"
          scp "${ssh_opts[@]}" \
            scripts/security/contain-production-demo-accounts.sh \
            deploy/backup-db-pair.sh \
            deploy/backup-db.sh \
            "$target:$REMOTE_DIR/"

          printf -v command \
            'set -euo pipefail; bundle_dir=%q; cleanup(){ case "$bundle_dir" in /tmp/gtas-vpp-account-containment-[0-9]*) rm -rf -- "$bundle_dir" ;; *) return 1 ;; esac; }; trap cleanup EXIT; chmod 0700 "$bundle_dir"/*.sh; CONTAINMENT_BUNDLE_DIR="$bundle_dir" "$bundle_dir"/contain-production-demo-accounts.sh' \
            "$REMOTE_DIR"

          ssh "${ssh_opts[@]}" "$target" "$command"

      - name: Remove remote temporary bundle
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_DIR: /tmp/gtas-vpp-account-containment-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ -s "$RUNNER_TEMP/containment_key" && -s "$RUNNER_TEMP/known_hosts" ]]; then
            ssh -i "$RUNNER_TEMP/containment_key" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              "$SSH_USER@$SSH_HOST" \
              "case '$REMOTE_DIR' in /tmp/gtas-vpp-account-containment-[0-9]*) rm -rf -- '$REMOTE_DIR' ;; *) exit 2 ;; esac"
          fi

      - name: Remove runner temporary material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/containment_key" \
            "$RUNNER_TEMP/known_hosts"
