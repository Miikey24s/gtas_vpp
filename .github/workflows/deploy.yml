name: Build and Deploy to DigitalOcean

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - Nam
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA on Nam; leave empty to deploy the selected Nam revision
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BE: ghcr.io/${{ github.repository_owner }}/gtas-vpp-backend
  IMAGE_NAME_FE: ghcr.io/${{ github.repository_owner }}/gtas-vpp-frontend

jobs:
  prepare-release:
    name: Prepare verified release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'Nam' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      target_sha: ${{ steps.release.outputs.target_sha }}

    steps:
      - name: Checkout Nam history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: Nam
          fetch-depth: 0

      - name: Resolve and validate release commit
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            target_sha="$AUTOMATIC_SHA"
          else
            target_sha="${MANUAL_SHA:-$WORKFLOW_SHA}"
          fi

          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release commit must be a full 40-character SHA." >&2
            exit 1
          fi

          git cat-file -e "$target_sha^{commit}"
          git merge-base --is-ancestor "$target_sha" origin/Nam || {
            echo "Release commit is not contained in branch Nam." >&2
            exit 1
          }

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            current_nam_sha="$(git rev-parse origin/Nam)"
            if [[ "$target_sha" != "$current_nam_sha" ]]; then
              echo "A newer Nam commit exists; skipping stale automatic deployment." >&2
              exit 1
            fi
          fi

          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Require successful CI checks for the exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          set -euo pipefail

          require_successful_check() {
            local check_name="$1"
            local conclusion
            conclusion="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"$check_name\")] | sort_by(.completed_at) | last | .conclusion // \"missing\"")"

            if [[ "$conclusion" != "success" ]]; then
              echo "Required check '$check_name' is '$conclusion' for $TARGET_SHA." >&2
              exit 1
            fi
          }

          require_successful_check "Secret scan (current tree)"
          require_successful_check "build-and-test"

  validate-release:
    name: Validate production bundle
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Validate deployment shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in deploy/*.sh; do
            bash -n "$script"
          done

      - name: Validate Compose production configuration
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/gtas-vpp.compose.env"
          cat > "$env_file" <<'EOF'
          DB_SA_PASSWORD=LocalValidation!Password123
          JWT_KEY=local-validation-jwt-key-that-is-longer-than-32-bytes
          BE_IMAGE=ghcr.io/example/backend:sha-0000000000000000000000000000000000000000
          FE_IMAGE=ghcr.io/example/frontend:sha-0000000000000000000000000000000000000000
          EMAIL_NOTIFICATIONS_ENABLED=false
          EOF
          docker compose --env-file "$env_file" -f docker-compose.prod.yml config --quiet
          rm -f "$env_file"

      - name: Validate Nginx production configs
        shell: bash
        run: |
          set -euo pipefail
          cert_dir="$RUNNER_TEMP/gtas-vpp-nginx-cert"
          mkdir -p "$cert_dir"
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$cert_dir/privkey.pem" \
            -out "$cert_dir/fullchain.pem" \
            -subj '/CN=gtas-vpp.annam.id.vn' -days 1 >/dev/null 2>&1

          docker run --rm \
            -v "$GITHUB_WORKSPACE/deploy/nginx/gtas-vpp.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$cert_dir:/etc/letsencrypt/live/gtas-vpp.annam.id.vn:ro" \
            nginx:1.24-alpine nginx -t

          docker run --rm \
            -v "$GITHUB_WORKSPACE/deploy/nginx/gtas-vpp-http.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.24-alpine nginx -t

  build-and-push:
    needs:
      - prepare-release
      - validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: gtas-vpp-build-${{ needs.prepare-release.outputs.target_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      be_image: ${{ steps.image_meta.outputs.be_image }}
      fe_image: ${{ steps.image_meta.outputs.fe_image }}
      image_version: ${{ steps.image_meta.outputs.image_version }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Resolve immutable image names
        id: image_meta
        shell: bash
        env:
          TARGET_SHA: ${{ needs.prepare-release.outputs.target_sha }}
        run: |
          set -euo pipefail
          be_image="$(printf '%s' '${{ env.IMAGE_NAME_BE }}' | tr '[:upper:]' '[:lower:]')"
          fe_image="$(printf '%s' '${{ env.IMAGE_NAME_FE }}' | tr '[:upper:]' '[:lower:]')"
          image_version="sha-$TARGET_SHA"
          {
            echo "be_image=$be_image"
            echo "fe_image=$fe_image"
            echo "image_version=$image_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deploy/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.image_meta.outputs.be_image }}:${{ steps.image_meta.outputs.image_version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deploy/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.image_meta.outputs.fe_image }}:${{ steps.image_meta.outputs.image_version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs:
      - prepare-release
      - build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: gtas-vpp-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://gtas-vpp.annam.id.vn
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Validate production environment file
        shell: bash
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
          DB_SA_PASSWORD: ${{ secrets.DB_SA_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_NOTIFICATIONS_ENABLED: ${{ vars.EMAIL_NOTIFICATIONS_ENABLED || 'false' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://gtas-vpp.annam.id.vn' }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS || 'noreply@notify.annam.id.vn' }}
          EMAIL_FROM_DISPLAY_NAME: ${{ vars.EMAIL_FROM_DISPLAY_NAME || 'GTAS VPP' }}
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST || 'smtp.resend.com' }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT || '2587' }}
          EMAIL_SMTP_USE_SSL: ${{ vars.EMAIL_SMTP_USE_SSL || 'true' }}
          EMAIL_SMTP_USERNAME: ${{ vars.EMAIL_SMTP_USERNAME || 'resend' }}
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/gtas-vpp.production.env"
          umask 077
          printf '%s\n' "$ENV_FILE_CONTENT" > "$env_file"
          printf 'DB_SA_PASSWORD=%s\n' "$DB_SA_PASSWORD" >> "$env_file"
          printf 'JWT_KEY=%s\n' "$JWT_KEY" >> "$env_file"
          printf 'EMAIL_NOTIFICATIONS_ENABLED=%s\n' "$EMAIL_NOTIFICATIONS_ENABLED" >> "$env_file"
          printf 'PUBLIC_BASE_URL=%s\n' "$PUBLIC_BASE_URL" >> "$env_file"
          printf 'EMAIL_FROM_ADDRESS=%s\n' "$EMAIL_FROM_ADDRESS" >> "$env_file"
          printf 'EMAIL_FROM_DISPLAY_NAME=%s\n' "$EMAIL_FROM_DISPLAY_NAME" >> "$env_file"
          printf 'EMAIL_SMTP_HOST=%s\n' "$EMAIL_SMTP_HOST" >> "$env_file"
          printf 'EMAIL_SMTP_PORT=%s\n' "$EMAIL_SMTP_PORT" >> "$env_file"
          printf 'EMAIL_SMTP_USE_SSL=%s\n' "$EMAIL_SMTP_USE_SSL" >> "$env_file"
          printf 'EMAIL_SMTP_USERNAME=%s\n' "$EMAIL_SMTP_USERNAME" >> "$env_file"
          printf 'EMAIL_SMTP_PASSWORD=%s\n' "$EMAIL_SMTP_PASSWORD" >> "$env_file"
          bash deploy/validate-env.sh "$env_file"

      - name: Configure pinned SSH host and private key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload immutable release bundle
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET_SHA: ${{ needs.prepare-release.outputs.target_sha }}
        run: |
          set -euo pipefail
          app_root="/app/gtas-vpp"
          release_dir="$app_root/releases/$TARGET_SHA"
          ssh_target="$SSH_USER@$SSH_HOST"
          ssh_options=(-i "$HOME/.ssh/id_deploy" -o BatchMode=yes -o IdentitiesOnly=yes)
          bundle="$RUNNER_TEMP/gtas-vpp-deploy.tar.gz"

          tar -czf "$bundle" docker-compose.prod.yml deploy
          ssh "${ssh_options[@]}" "$ssh_target" \
            "install -d -m 0750 '$app_root' '$app_root/releases' '$app_root/shared' '$release_dir'"
          scp "${ssh_options[@]}" "$bundle" \
            "$RUNNER_TEMP/gtas-vpp.production.env" \
            "$ssh_target:$release_dir/"

      - name: Deploy, verify, and record release
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.prepare-release.outputs.target_sha }}
          BE_IMAGE: ${{ needs.build-and-push.outputs.be_image }}:${{ needs.build-and-push.outputs.image_version }}
          FE_IMAGE: ${{ needs.build-and-push.outputs.fe_image }}:${{ needs.build-and-push.outputs.image_version }}
        run: |
          set -euo pipefail
          app_root="/app/gtas-vpp"
          release_dir="$app_root/releases/$TARGET_SHA"
          ssh_target="$SSH_USER@$SSH_HOST"
          ssh_options=(-i "$HOME/.ssh/id_deploy" -o BatchMode=yes -o IdentitiesOnly=yes)

          ssh "${ssh_options[@]}" "$ssh_target" \
            "set -e; cd '$release_dir'; tar -xzf gtas-vpp-deploy.tar.gz; rm gtas-vpp-deploy.tar.gz; install -m 0600 gtas-vpp.production.env '$app_root/shared/.env'; rm gtas-vpp.production.env; ln -sfn '$app_root/shared/.env' .env; bash deploy/validate-env.sh .env"

          printf '%s\n' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" "$ssh_target" \
            "set -euo pipefail; export DOCKER_CONFIG='/tmp/gtas-vpp-docker-$TARGET_SHA'; cleanup() { docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf \"\$DOCKER_CONFIG\"; }; trap cleanup EXIT; install -d -m 0700 \"\$DOCKER_CONFIG\"; docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin; cd '$release_dir'; BE_IMAGE='$BE_IMAGE' FE_IMAGE='$FE_IMAGE' DEPLOY_SHA='$TARGET_SHA' APP_ROOT='$app_root' bash deploy/deploy.sh; ln -sfn 'releases/$TARGET_SHA' '$app_root/current'"

      - name: Verify key-only SSH access after hardening
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if ssh -i "$HOME/.ssh/id_deploy" \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -o IdentitiesOnly=yes \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o PreferredAuthentications=publickey \
              "$SSH_USER@$SSH_HOST" true; then
              exit 0
            fi
            echo "SSH is not ready after hardening (attempt $attempt/12)."
            sleep 2
          done
          echo "SSH did not recover after hardening." >&2
          exit 1

      - name: Verify public boundary from the runner
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          PUBLIC_BASE_URL=https://gtas-vpp.annam.id.vn \
            bash deploy/smoke-frontend.sh
          for internal_port in 1433 5000 8080; do
            if timeout 5 bash -c "</dev/tcp/$SSH_HOST/$internal_port" 2>/dev/null; then
              echo "Internal port $internal_port is still reachable from the public internet." >&2
              exit 1
            fi
          done

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_deploy" \
            "$RUNNER_TEMP/gtas-vpp.production.env" \
            "$RUNNER_TEMP/gtas-vpp-deploy.tar.gz"
