name: Build and Deploy to DigitalOcean

on:
  push:
    branches:
      - Nam

env:
  REGISTRY: ghcr.io
  # Chuyển repository owner về chữ thường khi làm việc với Docker images
  IMAGE_NAME_BE: ghcr.io/${{ github.repository_owner }}/gtas-vpp-backend
  IMAGE_NAME_FE: ghcr.io/${{ github.repository_owner }}/gtas-vpp-frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore gtas_vpp.sln

      - name: Build solution
        run: dotnet build gtas_vpp.sln -c Release --no-restore

      - name: Run backend tests
        run: dotnet test gtas_vpp_be.Tests/gtas_vpp_be.Tests.csproj -c Release --no-build

      - name: Run frontend tests
        run: dotnet test gtas_vpp_fe.Tests/gtas_vpp_fe.Tests.csproj -c Release --no-build

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: gtas-vpp-build-${{ github.workflow }}-${{ github.ref_name || 'Nam' }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      be_image_lower: ${{ steps.image_meta.outputs.be_image_lower }}
      fe_image_lower: ${{ steps.image_meta.outputs.fe_image_lower }}
      image_version: ${{ steps.image_meta.outputs.image_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve checked-out commit SHA
        id: source_state
        shell: bash
        run: |
          set -euo pipefail

          echo "root_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Print build context
        shell: bash
        run: |
          set -euo pipefail

          echo "Monorepo commit: ${{ steps.source_state.outputs.root_sha }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convert repository names to lowercase and create a unique image version per workflow run.
      - name: Resolve image tag names
        id: image_meta
        shell: bash
        env:
          ROOT_SHA: ${{ steps.source_state.outputs.root_sha }}
        run: |
          set -euo pipefail

          echo "be_image_lower=$(echo '${{ env.IMAGE_NAME_BE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "fe_image_lower=$(echo '${{ env.IMAGE_NAME_FE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

          short_root="${ROOT_SHA:0:12}"
          image_version="run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-${short_root}"
          echo "image_version=${image_version}" >> "$GITHUB_OUTPUT"

      # ── Build & Push Backend ──
      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./gtas_vpp_be
          push: true
          tags: |
            ${{ steps.image_meta.outputs.be_image_lower }}:latest
            ${{ steps.image_meta.outputs.be_image_lower }}:${{ steps.image_meta.outputs.image_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build & Push Frontend ──
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./gtas_vpp_fe/Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.fe_image_lower }}:latest
            ${{ steps.image_meta.outputs.fe_image_lower }}:${{ steps.image_meta.outputs.image_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: gtas-vpp-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: Nam

      # 1. Kết nối SSH tạo thư mục app và ghi file .env
      - name: Configure environment on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /app/gtas-vpp/nginx
            echo "${{ secrets.ENV_FILE_CONTENT }}" > /app/gtas-vpp/.env

      # 2. Copy file docker-compose.prod.yml và nginx configs lên VPS
      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/**"
          target: "/app/gtas-vpp"

      # 3. Kết nối SSH chạy Docker Compose để Deploy
      - name: Deploy containers on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /app/gtas-vpp
            COMPOSE_FILE=docker-compose.prod.yml
            DB_CONTAINER=gtas-vpp-db
            BACKEND_CONTAINER=gtas-vpp-backend
            FRONTEND_CONTAINER=gtas-vpp-frontend
            APP_NETWORK=gtas-vpp-internal
            
            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pin deploy to this exact build instead of relying on a mutable latest tag.
            export BE_IMAGE="${{ needs.build-and-push.outputs.be_image_lower }}:${{ needs.build-and-push.outputs.image_version }}"
            export FE_IMAGE="${{ needs.build-and-push.outputs.fe_image_lower }}:${{ needs.build-and-push.outputs.image_version }}"
            
            # Pull the exact images built by this workflow.
            docker compose -f "$COMPOSE_FILE" pull

            # Reuse the long-lived SQL Server container when it already exists on the VPS.
            docker network inspect "$APP_NETWORK" >/dev/null 2>&1 || docker network create "$APP_NETWORK"
            if docker container inspect "$DB_CONTAINER" >/dev/null 2>&1; then
              docker network connect "$APP_NETWORK" "$DB_CONTAINER" 2>/dev/null || true
              docker start "$DB_CONTAINER" >/dev/null 2>&1 || true
            else
              docker compose -f "$COMPOSE_FILE" up -d db
            fi

            db_status=""
            for attempt in $(seq 1 60); do
              db_status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else if .State.Running}}running{{else}}stopped{{end}}' "$DB_CONTAINER" 2>/dev/null || true)
              if [ "$db_status" = "healthy" ] || [ "$db_status" = "running" ]; then
                break
              fi
              if [ "$db_status" = "unhealthy" ]; then
                docker logs --tail 100 "$DB_CONTAINER"
                exit 1
              fi
              sleep 2
            done

            if [ "$db_status" != "healthy" ] && [ "$db_status" != "running" ]; then
              docker logs --tail 100 "$DB_CONTAINER" 2>/dev/null || true
              echo "Database did not become ready in time."
              exit 1
            fi

            # Apply schema/data changes before replacing the running application.
            docker compose -f "$COMPOSE_FILE" run --rm --no-deps migrator

            # Replace backend only after migration succeeds.
            docker rm -f "$BACKEND_CONTAINER" >/dev/null 2>&1 || true
            docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate backend

            backend_status=""
            for attempt in $(seq 1 60); do
              backend_status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$BACKEND_CONTAINER" 2>/dev/null || true)
              if [ "$backend_status" = "healthy" ]; then
                break
              fi
              if [ "$backend_status" = "unhealthy" ]; then
                docker logs --tail 100 "$BACKEND_CONTAINER"
                exit 1
              fi
              sleep 2
            done

            if [ "$backend_status" != "healthy" ]; then
              docker logs --tail 100 "$BACKEND_CONTAINER"
              echo "Backend did not become healthy in time."
              exit 1
            fi

            # Frontend is replaced only after the new backend is healthy.
            docker rm -f "$FRONTEND_CONTAINER" >/dev/null 2>&1 || true
            docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate frontend

            # Apply host-level nginx cache/proxy changes when this VPS uses shared nginx.
            if command -v nginx >/dev/null 2>&1; then
              sudo install -m 0644 nginx/gtas-vpp.conf /etc/nginx/sites-available/gtas-vpp
              sudo ln -sf /etc/nginx/sites-available/gtas-vpp /etc/nginx/sites-enabled/gtas-vpp
              sudo nginx -t
              sudo systemctl reload nginx
            fi

            docker compose -f "$COMPOSE_FILE" ps
            
            # Xóa các image cũ không dùng để giải phóng bộ nhớ VPS
            docker image prune -f
