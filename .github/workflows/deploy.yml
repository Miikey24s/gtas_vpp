name: Build and Deploy to DigitalOcean

on:
  push:
    branches:
      - master
      - Nam

env:
  REGISTRY: ghcr.io
  # Chuyển repository owner về chữ thường khi làm việc với Docker images
  IMAGE_NAME_BE: ghcr.io/${{ github.repository_owner }}/gtas-vpp-backend
  IMAGE_NAME_FE: ghcr.io/${{ github.repository_owner }}/gtas-vpp-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convert repository names to lowercase
      - name: Inject image tag names
        run: |
          echo "BE_IMAGE_LOWER=$(echo '${{ env.IMAGE_NAME_BE }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "FE_IMAGE_LOWER=$(echo '${{ env.IMAGE_NAME_FE }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # ── Build & Push Backend ──
      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./gtas_vpp_be
          push: true
          tags: |
            ${{ env.BE_IMAGE_LOWER }}:latest
            ${{ env.BE_IMAGE_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build & Push Frontend ──
      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./gtas_vpp_fe
          push: true
          tags: |
            ${{ env.FE_IMAGE_LOWER }}:latest
            ${{ env.FE_IMAGE_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject image tag names for Deploy
        run: |
          echo "BE_IMAGE_LOWER=$(echo '${{ env.IMAGE_NAME_BE }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "FE_IMAGE_LOWER=$(echo '${{ env.IMAGE_NAME_FE }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 1. Kết nối SSH tạo thư mục app và ghi file .env
      - name: Configure environment on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /app/gtas-vpp/nginx
            echo "${{ secrets.ENV_FILE_CONTENT }}" > /app/gtas-vpp/.env

      # 2. Copy file docker-compose.prod.yml và nginx configs lên VPS
      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/**"
          target: "/app/gtas-vpp"

      # 3. Kết nối SSH chạy Docker Compose để Deploy
      - name: Deploy containers on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /app/gtas-vpp
            
            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull image mới nhất và restart container
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Xóa các image cũ không dùng để giải phóng bộ nhớ VPS
            docker image prune -f
