name: Build and Deploy to DigitalOcean

on:
  push:
    branches:
      - Nam
    paths:
      - .github/workflows/deploy.yml
      - .dockerignore
      - Directory.Build.props
      - gtas_vpp.sln
      - gtas_vpp_be/**
      - gtas_vpp_fe/**
      - docker-compose.prod.yml
      - deploy/**
      - nginx/**
      - gtas_vpp_fe_react/**
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BE: ghcr.io/${{ github.repository_owner }}/gtas-vpp-backend
  IMAGE_NAME_FE: ghcr.io/${{ github.repository_owner }}/gtas-vpp-frontend
  IMAGE_NAME_REACT_FE: ghcr.io/${{ github.repository_owner }}/gtas-vpp-react-frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore gtas_vpp.sln

      - name: Build solution
        run: dotnet build gtas_vpp.sln -c Release --no-restore

      - name: Run backend tests
        run: dotnet test gtas_vpp_be.Tests/gtas_vpp_be.Tests.csproj -c Release --no-build

      - name: Run frontend tests
        run: dotnet test gtas_vpp_fe.Tests/gtas_vpp_fe.Tests.csproj -c Release --no-build

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gtas_vpp_fe_react/package-lock.json

      - name: Verify React frontend
        working-directory: gtas_vpp_fe_react
        run: |
          npm ci
          npm run check
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Validate Nginx production configs
        shell: bash
        run: |
          set -euo pipefail
          cert_dir="$RUNNER_TEMP/gtas-vpp-nginx-cert"
          mkdir -p "$cert_dir"
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$cert_dir/privkey.pem" \
            -out "$cert_dir/fullchain.pem" \
            -subj '/CN=gtas-vpp.annam.id.vn' -days 1 >/dev/null 2>&1

          for config in nginx/gtas-vpp.conf nginx/gtas-vpp-blazor.conf; do
            docker run --rm \
              -v "$GITHUB_WORKSPACE/$config:/etc/nginx/conf.d/default.conf:ro" \
              -v "$cert_dir:/etc/letsencrypt/live/gtas-vpp.annam.id.vn:ro" \
              nginx:1.30-alpine nginx -t
          done

          docker run --rm \
            -v "$GITHUB_WORKSPACE/nginx/gtas-vpp-http.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.30-alpine nginx -t
          docker run --rm \
            -v "$GITHUB_WORKSPACE/gtas_vpp_fe_react/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.30-alpine nginx -t

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: gtas-vpp-build-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      be_image: ${{ steps.image_meta.outputs.be_image }}
      fe_image: ${{ steps.image_meta.outputs.fe_image }}
      react_fe_image: ${{ steps.image_meta.outputs.react_fe_image }}
      image_version: ${{ steps.image_meta.outputs.image_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve immutable image names
        id: image_meta
        shell: bash
        run: |
          set -euo pipefail
          be_image="$(printf '%s' '${{ env.IMAGE_NAME_BE }}' | tr '[:upper:]' '[:lower:]')"
          fe_image="$(printf '%s' '${{ env.IMAGE_NAME_FE }}' | tr '[:upper:]' '[:lower:]')"
          react_fe_image="$(printf '%s' '${{ env.IMAGE_NAME_REACT_FE }}' | tr '[:upper:]' '[:lower:]')"
          image_version="sha-${GITHUB_SHA}"
          {
            echo "be_image=$be_image"
            echo "fe_image=$fe_image"
            echo "react_fe_image=$react_fe_image"
            echo "image_version=$image_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./gtas_vpp_be
          push: true
          tags: |
            ${{ steps.image_meta.outputs.be_image }}:${{ steps.image_meta.outputs.image_version }}
            ${{ steps.image_meta.outputs.be_image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./gtas_vpp_fe/Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.fe_image }}:${{ steps.image_meta.outputs.image_version }}
            ${{ steps.image_meta.outputs.fe_image }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push React frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./gtas_vpp_fe_react
          file: ./gtas_vpp_fe_react/Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.react_fe_image }}:${{ steps.image_meta.outputs.image_version }}
            ${{ steps.image_meta.outputs.react_fe_image }}:latest
          cache-from: type=gha,scope=react-frontend
          cache-to: type=gha,mode=max,scope=react-frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: gtas-vpp-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://gtas-vpp.annam.id.vn
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate production environment file
        shell: bash
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
          DB_SA_PASSWORD: ${{ secrets.DB_SA_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/gtas-vpp.production.env"
          umask 077
          printf '%s\n' "$ENV_FILE_CONTENT" > "$env_file"
          printf 'DB_SA_PASSWORD=%s\n' "$DB_SA_PASSWORD" >> "$env_file"
          printf 'JWT_KEY=%s\n' "$JWT_KEY" >> "$env_file"
          bash deploy/validate-env.sh "$env_file"

      - name: Configure pinned SSH host and private key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload immutable release bundle
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          app_root="/app/gtas-vpp"
          release_dir="$app_root/releases/$GITHUB_SHA"
          ssh_target="$SSH_USER@$SSH_HOST"
          ssh_options=(-i "$HOME/.ssh/id_deploy" -o BatchMode=yes -o IdentitiesOnly=yes)
          bundle="$RUNNER_TEMP/gtas-vpp-deploy.tar.gz"

          tar -czf "$bundle" docker-compose.prod.yml nginx deploy
          ssh "${ssh_options[@]}" "$ssh_target" \
            "install -d -m 0750 '$app_root' '$app_root/releases' '$app_root/shared' '$release_dir'"
          scp "${ssh_options[@]}" "$bundle" \
            "$RUNNER_TEMP/gtas-vpp.production.env" \
            "$ssh_target:$release_dir/"

      - name: Deploy, verify, and record release
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BE_IMAGE: ${{ needs.build-and-push.outputs.be_image }}:${{ needs.build-and-push.outputs.image_version }}
          FE_IMAGE: ${{ needs.build-and-push.outputs.fe_image }}:${{ needs.build-and-push.outputs.image_version }}
          REACT_FE_IMAGE: ${{ needs.build-and-push.outputs.react_fe_image }}:${{ needs.build-and-push.outputs.image_version }}
        run: |
          set -euo pipefail
          app_root="/app/gtas-vpp"
          release_dir="$app_root/releases/$GITHUB_SHA"
          ssh_target="$SSH_USER@$SSH_HOST"
          ssh_options=(-i "$HOME/.ssh/id_deploy" -o BatchMode=yes -o IdentitiesOnly=yes)

          ssh "${ssh_options[@]}" "$ssh_target" \
            "set -e; cd '$release_dir'; tar -xzf gtas-vpp-deploy.tar.gz; rm gtas-vpp-deploy.tar.gz; install -m 0600 gtas-vpp.production.env '$app_root/shared/.env'; rm gtas-vpp.production.env; ln -sfn '$app_root/shared/.env' .env; bash deploy/validate-env.sh .env"

          printf '%s\n' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" "$ssh_target" \
            "set -euo pipefail; export DOCKER_CONFIG='/tmp/gtas-vpp-docker-$GITHUB_SHA'; cleanup() { docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf \"\$DOCKER_CONFIG\"; }; trap cleanup EXIT; install -d -m 0700 \"\$DOCKER_CONFIG\"; docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin; cd '$release_dir'; BE_IMAGE='$BE_IMAGE' FE_IMAGE='$FE_IMAGE' REACT_FE_IMAGE='$REACT_FE_IMAGE' DEPLOY_SHA='$GITHUB_SHA' APP_ROOT='$app_root' bash deploy/deploy.sh; ln -sfn 'releases/$GITHUB_SHA' '$app_root/current'"

      - name: Verify key-only SSH access after hardening
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if ssh -i "$HOME/.ssh/id_deploy" \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -o IdentitiesOnly=yes \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o PreferredAuthentications=publickey \
              "$SSH_USER@$SSH_HOST" true; then
              exit 0
            fi
            echo "SSH is not ready after hardening (attempt $attempt/12)."
            sleep 2
          done
          echo "SSH did not recover after hardening." >&2
          exit 1

      - name: Verify public boundary from the runner
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          PUBLIC_BASE_URL=https://gtas-vpp.annam.id.vn \
            bash deploy/smoke-frontend.sh
          for internal_port in 1433 5000 5100 8080; do
            if timeout 5 bash -c "</dev/tcp/$SSH_HOST/$internal_port" 2>/dev/null; then
              echo "Internal port $internal_port is still reachable from the public internet." >&2
              exit 1
            fi
          done

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_deploy" \
            "$RUNNER_TEMP/gtas-vpp.production.env" \
            "$RUNNER_TEMP/gtas-vpp-deploy.tar.gz"
