# ─────────────────────────────────────────────────────────────
# GTAS VPP - local Development stack
# ─────────────────────────────────────────────────────────────
#
# Usage:
#   docker compose up -d --build
#
# ─────────────────────────────────────────────────────────────

name: gtas-vpp-dev

services:

  # ── SQL Server Database ──────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gtas-vpp-db
    restart: unless-stopped
    init: true
    environment:
      TZ: "Asia/Ho_Chi_Minh"
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD:?DB_SA_PASSWORD environment variable is required.}"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "${MSSQL_MEMORY_LIMIT_MB:-2048}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 3g
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C -b >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - vpp-internal

  # ── Backend (.NET 10 Web API) ────────────────────────────
  backend:
    build:
      context: ./gtas_vpp_be
      dockerfile: Dockerfile
    container_name: gtas-vpp-backend
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: "Asia/Ho_Chi_Minh"
      ASPNETCORE_ENVIRONMENT: "Development"
      DatabaseSettings__DefaultEnvironment: "TestEnv"
      DatabaseInitialization__Mode: "MigrateAndReference"
      DatabaseInitialization__Environments__0: "TestEnv"
      # Local/test only. LiveEnv is intentionally unavailable in this compose file.
      ConnectionStrings__TestEnv: "Server=db,1433;Database=GTAS_VPP_LIVE;User Id=sa;Password=${DB_SA_PASSWORD:?DB_SA_PASSWORD environment variable is required.};TrustServerCertificate=True;Encrypt=False;"
      JwtSettings__Key: "${JWT_KEY:?JWT_KEY environment variable is required and must be set.}"
      JwtSettings__Issuer: "gtas_vpp_be"
      JwtSettings__Audience: "gtas_vpp_clients"
      PasswordEncryption__Key: "${PASSWORD_ENCRYPTION_KEY:?PASSWORD_ENCRYPTION_KEY environment variable is required.}"
      ReportInsights__Enabled: "${REPORT_INSIGHTS_ENABLED:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      CorsSettings__AllowedOrigins__0: "http://localhost:5000"
      CorsSettings__AllowedOrigins__1: "http://localhost:5203"
      CorsSettings__AllowedOrigins__2: "https://localhost:7009"
      DOTNET_gcServer: "0"
      DOTNET_GCHeapHardLimitPercent: "75"
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 512m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 30s
    volumes:
      - backend-logs:/app/logs:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vpp-internal

  # ── Frontend (Blazor Server) ─────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: gtas_vpp_fe/Dockerfile
    container_name: gtas-vpp-frontend
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: "Asia/Ho_Chi_Minh"
      ASPNETCORE_ENVIRONMENT: "Development"
      ApiSettings__BaseUrl: "http://backend:8080"
      DataProtection__KeysPath: "/app/keys"
      DOTNET_gcServer: "0"
      DOTNET_GCHeapHardLimitPercent: "75"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:5000:5000"
    mem_limit: 512m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 30s
    volumes:
      - frontend-keys:/app/keys:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - vpp-internal

volumes:
  sqlserver-data:
    driver: local
  backend-logs:
    driver: local
  frontend-keys:
    driver: local

networks:
  vpp-internal:
    driver: bridge
