# ─────────────────────────────────────────────────────────────
# GTAS VPP – Nginx Site Config (Host-level, shared Nginx)
# File: /etc/nginx/sites-available/gtas-vpp
# Symlink: ln -s /etc/nginx/sites-available/gtas-vpp /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────

# Required for WebSocket (Blazor Server SignalR)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name gtas-vpp.annam.id.vn;

    # Let's Encrypt auto-redirect (certbot will modify this)
    # After SSL setup, certbot adds redirect to 443 automatically

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name gtas-vpp.annam.id.vn;

    # ── SSL (Let's Encrypt – certbot will fill these) ────
    ssl_certificate     /etc/letsencrypt/live/gtas-vpp.annam.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtas-vpp.annam.id.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Gzip ─────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json
               application/xml application/wasm image/svg+xml font/woff2;

    client_max_body_size 10m;

    # ── API → Backend container ──────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    # ── Swagger ──────────────────────────────────────────
    location /swagger {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Blazor SignalR Hub (WebSocket) ───────────────────
    location /_blazor {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Everything else → Frontend ───────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}
